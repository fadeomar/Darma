<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Decorative dusk landscape placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.42" stop-color="#6d28d9"/>
      <stop offset="0.72" stop-color="#db2777"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="230" fill="url(#glow)"/>
  <circle cx="400" cy="250" r="62" fill="#fef9c3" fill-opacity="0.92"/>

  <rect x="0" y="330" width="800" height="270" fill="url(#water)"/>
  <g fill="#fde68a" fill-opacity="0.35">
    <rect x="330" y="356" width="140" height="6" rx="3"/>
    <rect x="300" y="386" width="200" height="5" rx="2.5"/>
    <rect x="345" y="414" width="110" height="5" rx="2.5"/>
    <rect x="285" y="446" width="230" height="4" rx="2"/>
  </g>

  <path d="M0 330 L118 268 L214 316 L318 246 L400 300 L470 258 L566 320 L668 262 L800 330 Z" fill="#4c1d95" fill-opacity="0.78"/>
  <path d="M0 360 L96 322 L206 356 L322 300 L438 350 L540 312 L664 358 L800 320 L800 360 Z" fill="#2e1065" fill-opacity="0.9"/>
  <path d="M0 600 L0 402 L132 366 L268 404 L404 368 L548 408 L688 372 L800 402 L800 600 Z" fill="#140b33"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
