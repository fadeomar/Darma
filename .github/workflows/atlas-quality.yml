name: Tech Atlas quality

on:
  pull_request:
    paths:
      - "src/app/about/**"
      - "src/app/contribute/**"
      - "src/app/search/**"
      - "src/app/sitemap.ts"
      - "src/components/navigation/**"
      - "src/app/resources/**"
      - "src/app/learning-paths/**"
      - "src/app/tech-atlas/**"
      - "src/app/tech-careers/**"
      - "src/app/ways-of-working/**"
      - "src/app/tech-glossary/**"
      - "src/app/tech-teams/**"
      - "src/features/resources/**"
      - "src/features/search/**"
      - "src/features/learning-paths/**"
      - "src/features/tech-careers/**"
      - "src/features/ways-of-working/**"
      - "src/features/tech-glossary/**"
      - "src/features/tech-teams/**"
      - "scripts/atlas/**"
      - "scripts/resources/**"
      - "scripts/learning-paths/**"
      - "scripts/tech-atlas/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/app/about/**"
      - "src/app/contribute/**"
      - "src/app/search/**"
      - "src/app/sitemap.ts"
      - "src/app/resources/**"
      - "src/app/learning-paths/**"
      - "src/app/tech-atlas/**"
      - "src/app/tech-careers/**"
      - "src/app/ways-of-working/**"
      - "src/app/tech-glossary/**"
      - "src/app/tech-teams/**"
      - "src/components/navigation/**"
      - "src/features/resources/**"
      - "src/features/search/**"
      - "src/features/learning-paths/**"
      - "src/features/tech-careers/**"
      - "src/features/ways-of-working/**"
      - "src/features/tech-glossary/**"
      - "src/features/tech-teams/**"
      - "scripts/atlas/**"
      - "scripts/resources/**"
      - "scripts/learning-paths/**"
      - "scripts/tech-atlas/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth: the npm that ships with the
          # Node version here must match the one that writes package-lock.json
          # locally, or `npm ci` fails on optional peer entries.
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Tech Atlas quality gates
        run: npm run atlas:quality
      - name: Type check
        run: npm run typecheck
